# Site
locale      : "en-US"
title       : "Md. Farhad Momin"
name        : "Md. Farhad Momin"
description : "Md. Farhad Momin's academic portfolio"
url         : https://farhad-momin.github.io
baseurl     : ""
repository  : "farhad-momin/farhad-momin.github.io"

# Author (shown on the home page)
author:
  avatar       : "profile-720.jpg"
  name         : "Md. Farhad Momin"
  pronouns     : "he/him"
  bio          : "Lecturer | Researcher"
  location     : "Dhaka, Bangladesh"
  employer     : "World University of Bangladesh"
  email        : "farhadmomin.ce@gmail.com"
  googlescholar: "https://scholar.google.com/citations?user=_MDkhacAAAAJ&hl=en"
  orcid        : "https://orcid.org/0009-0004-2499-4772"
  researchgate : "https://www.researchgate.net/profile/Md-Farhad-Momin"
  scopus       : "https://www.scopus.com/authid/detail.uri?authorId=58338983300"
  linkedin     : "mdfarhadmomin"

publication_category:
  journal:
    title: "Journal Articles"
  conference:
    title: "Conference Papers / Proceedings"

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - package.json
  - vendor
  - node_modules
  # Old template content kept in the repo but no longer built
  - _posts
  - _drafts
  - _talks
  - _portfolio
  - _teaching
  - _sass
  - files
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - scripts
  - markdown_generator
  - assets/css/main.scss
  - assets/css/academicons.css
  - assets/css/academicons.min.css
  - assets/css/collapse.css
  - assets/js
  - assets/fonts
  - assets/webfonts
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv-json.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/sitemap.md
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/terms.md
  - _pages/year-archive.html

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  publications:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: page

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
